name: CI

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python -m unittest discover -v

    - name: Run short training example (1 epoch)
      run: |
        python scripts/train_example.py --epochs 1 --batch-size 8 --save-dir models/ci_run

    - name: Export ONNX (if checkpoint produced)
      run: |
        if [ -f models/ci_run/best_model.pth ]; then python scripts/export_onnx.py --checkpoint models/ci_run/best_model.pth --onnx-path models/ci_run/best_model.onnx; fi
